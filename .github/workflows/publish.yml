name: Publish feeds

on:
  schedule:
    # Every 5 minutes, GitHub's shortest schedule; runs may start a few minutes late.
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment:
      name: github-pages
    steps:
      - uses: actions/checkout@v4
      - name: Test
        run: python3 -m unittest scripts/test_esports.py scripts/test_cs2.py
      - name: Build the esports feed
        env:
          PANDASCORE_KEY: ${{ secrets.PANDASCORE_KEY }}
        run: python3 scripts/esports.py
      - name: Build the Counter-Strike 2 feed
        # Without it the other feeds still go out; the widget says the matches are unavailable.
        continue-on-error: true
        env:
          LIQUIPEDIA_KEY: ${{ secrets.LIQUIPEDIA_KEY }}
        run: python3 scripts/cs2.py
      - name: Index
        run: echo '{"esports":"esports/<game>.json","cs2":"cs2/matches.json"}' > site/index.json
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
